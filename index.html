<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E30613">
<meta name="description" content="Controle de recebíveis da venda do terreno - Rua Topázio, 110 - Ibirité/MG">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Venda do Terreno">
<title>Venda do Terreno</title>
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=3">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=3">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ LOGIN / PRIMEIRO ACESSO ============ -->
<section id="tela-login" class="tela-login hidden">
  <div class="login-box">
    <img src="icons/logo.png" alt="Venda do Terreno" class="login-logo">
    <h1 id="login-titulo">Entrar</h1>
    <p id="login-sub" class="muted">Controle de recebíveis — Lote 344, Qd. 76 · Ibirité/MG</p>
    <form id="form-login" autocomplete="on">
      <label>Usuário
        <input id="lg-usuario" type="text" autocomplete="username" autocapitalize="none" required>
      </label>
      <label>Senha
        <div class="senha-wrap">
          <input id="lg-senha" type="password" autocomplete="current-password" required minlength="4">
          <button type="button" class="olho" data-alvo="lg-senha" aria-label="Mostrar senha">👁</button>
        </div>
      </label>
      <label id="wrap-confirma" class="hidden">Confirmar senha
        <input id="lg-confirma" type="password" autocomplete="new-password" minlength="4">
      </label>
      <p id="login-erro" class="erro hidden"></p>
      <button type="submit" class="btn btn-primario btn-bloco" id="btn-login">Entrar</button>
    </form>
    <button class="btn btn-outline btn-bloco btn-instalar hidden" type="button">📲 Instalar aplicativo</button>
    <button id="btn-esqueci" class="link-btn hidden" type="button">Esqueci minha senha</button>
    <p class="muted pequeno">Por segurança, a sessão encerra automaticamente 6 horas após o login.</p>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="topo">
    <div class="topo-inner">
      <img src="icons/logo.png" alt="" class="topo-logo">
      <div class="topo-txt">
        <strong id="topo-titulo">Início</strong>
        <span id="topo-sessao" class="pequeno"></span>
      </div>
      <button class="icone-btn btn-instalar hidden" type="button" title="Instalar app">📲</button>
      <button id="btn-sair-topo" class="icone-btn" type="button" title="Sair">⏻</button>
    </div>
  </header>

  <main id="conteudo" class="conteudo"></main>

  <nav class="nav-inferior">
    <div class="nav-inner">
      <button data-view="inicio" class="ativo"><span>🏠</span>Início</button>
      <button data-view="parcelas"><span>💰</span>Parcelas</button>
      <button data-view="contratos"><span>📄</span>Contratos</button>
      <button data-view="ajustes"><span>⚙️</span>Ajustes</button>
    </div>
  </nav>
</div>

<!-- ============ MODAL / BOTTOM SHEET ============ -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-fundo" data-fechar></div>
  <div class="modal-folha">
    <div class="modal-cab">
      <strong id="modal-titulo"></strong>
      <button class="icone-btn" data-fechar aria-label="Fechar">✕</button>
    </div>
    <div id="modal-corpo" class="modal-corpo"></div>
  </div>
</div>

<!-- Visualizador de imagem -->
<div id="visor" class="visor hidden">
  <button class="icone-btn visor-fechar" aria-label="Fechar">✕</button>
  <img id="visor-img" alt="Comprovante">
</div>

<div id="toast" class="toast hidden"></div>
<input type="file" id="input-arquivo" accept="image/*,application/pdf" class="hidden">
<input type="file" id="input-backup" accept="application/json,.json,text/plain,.txt" class="hidden">

<script src="app.js"></script>
</body>
</html>
